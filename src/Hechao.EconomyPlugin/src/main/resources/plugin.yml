name: HechaoEconomy
version: '0.1.7'
main: world.hechao.economy.HechaoEconomyPlugin
api-version: '1.21'
load: POSTWORLD
depend:
  - Vault
softdepend:
  - PlaceholderAPI
  - Essentials
description: Authoritative fail-closed economy bridge for Hechao survival servers.
authors:
  - Hechao
commands:
  money:
    description: 查看赫朝金币余额
    usage: /money [玩家]
    aliases: [balance, bal]
    permission: hechao.economy.use
  pay:
    description: 向在线玩家转账
    usage: /pay <玩家> <金额> [confirm]
    permission: hechao.economy.use
  sell:
    description: 出售主手中的白名单物品
    usage: /sell [confirm]
    permission: hechao.economy.use
  shop:
    description: 查看服务器回收目录
    usage: /shop
    permission: hechao.economy.use
  heco:
    description: 赫朝经济管理
    usage: /heco <health|menu|product|reload>
    permission: hechao.economy.use
permissions:
  hechao.economy.use:
    default: true
  hechao.economy.balance.others:
    default: op
  hechao.economy.admin:
    default: op
