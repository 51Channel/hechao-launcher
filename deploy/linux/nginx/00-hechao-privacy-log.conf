# Query strings and referrers can contain reset, OAuth, or signed-download tokens.
log_format hechao_privacy escape=json
    '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" '
    '$status $body_bytes_sent '
    '"$host" "$http_user_agent" '
    'rt=$request_time rid=$request_id';
